  <!-- Dark is the default and the primary mode, whatever the system says. ?theme=light overrides it, for review. Set before first paint. -->
  <script>(function(){var q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark'})()</script>
  <!-- Launch key, first thing the page does: #key=... goes into this tab's sessionStorage and out of the address bar before any module runs (the rest of the fragment is kept). -->
  <script>(function(){var h=location.hash.replace(/^#/,''),p=new URLSearchParams(h),k=p.get('key');if(!k)return;try{sessionStorage.setItem('rhl.key',k)}catch(e){}p.delete('key');var r=p.toString();try{history.replaceState(null,'',location.pathname+location.search+(r?'#'+r:''))}catch(e){}})()</script>
